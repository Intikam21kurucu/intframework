<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nmap Scan</title>
<style>
    body {
        background-color: #1d1d1d;
        color: #eee;
        font-family: Arial, sans-serif;
        padding: 20px;
    }
    .container {
        max-width: 700px;
        margin: auto;
        background: #2b2b2b;
        padding: 20px;
        border-radius: 10px;
    }
    h1 { text-align: center; color: #4caf50; }

    input, button {
        width: 100%;
        padding: 12px;
        margin-top: 10px;
        border-radius: 6px;
        border: none;
        background: #3a3a3a;
        color: #fff;
    }
    button {
        background: #4caf50;
        cursor: pointer;
    }
    button:hover {
        background: #45a049;
    }

    .port-container {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 15px;
    }
    .port-box {
        background: #1f441e;
        padding: 12px;
        border-radius: 8px;
        width: 120px;
        text-align: center;
        border: 1px solid #2fa72f;
        box-shadow: 0 0 6px #2fa72f;
    }
    .port-number {
        font-size: 20px;
        font-weight: bold;
        display: block;
        color: #7aff7a;
    }
    .port-status {
        color: #b6ffb6;
        font-size: 14px;
    }

    .no-port-box {
        background: #3a3a3a;
        padding: 15px;
        border-radius: 8px;
        margin-top: 20px;
        text-align: center;
        color: #bbb;
        border: 1px solid #555;
    }
</style>
</head>
<body>

<div class="container">
    <h1>Port Scanner</h1>

    <form method="POST">
        <input type="text" name="ip" placeholder="Enter IP (e.g. 192.168.1.10)" required>
        <input type="text" name="ports" placeholder="Ports (80,443,22) — leave empty for full scan">
        <button type="submit">Start Scan</button>
    </form>

    {% if result %}
        <div style="margin-top:20px;">
            {{ result | safe }}
        </div>
    {% endif %}
</div>

</body>
</html>
