<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subdomain Scanner</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #1e1e1e;
        color: white;
        margin: 0;
        padding: 20px;
    }
    .container {
        max-width: 750px;
        margin: 0 auto;
        background-color: #2b2b2b;
        padding: 20px;
        border-radius: 8px;
        border: 1px solid #444;
    }
    h1 {
        text-align: center;
        margin-bottom: 20px;
    }
    form {
        display: flex;
        flex-direction: column;
    }
    input[type="text"], select {
        width: 100%;
        padding: 12px;
        margin: 8px 0;
        border-radius: 4px;
        border: 1px solid #555;
        background-color: #3a3a3a;
        color: #fff;
    }
    button {
        padding: 12px;
        margin-top: 8px;
        border: none;
        border-radius: 4px;
        background-color: #4CAF50;
        color: white;
        cursor: pointer;
        font-size: 16px;
    }
    button:hover {
        background-color: #45a049;
    }
    .menu {
        display: flex;
        justify-content: space-between;
        margin-bottom: 12px;
    }
    .menu button {
        width: 48%;
        font-size: 14px;
    }
    .result {
        margin-top: 15px;
        background-color: #1f1f1f;
        padding: 15px;
        border-radius: 4px;
        white-space: pre-wrap;
        font-family: monospace;
        border: 1px solid #444;
        max-height: 400px;
        overflow-y: auto;
    }
    .options {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
    }
    .options label {
        font-size: 14px;
    }
    .options select {
        flex: 1;
    }
</style>
</head>
<body>

<div class="container">
    <h1>Subdomain Scanner</h1>

    <form method="POST">
        <input type="text" name="domain" placeholder="Enter Domain (example.com)" required>

        <div class="options">
            <label>
                Wordlist:
                <select name="wordlist">
                    <option value="small">Small</option>
                    <option value="medium">Medium</option>
                    <option value="large">Large</option>
                </select>
            </label>
            <label>
                Engines:
                <select name="engines" multiple>
                    <option value="brute_force" selected>Brute Force</option>
                    <option value="crt">Certificate Transparency</option>
                    <option value="osint" selected>OSINT API</option>
                    <option value="resolver">DNS Resolver</option>
                </select>
            </label>
        </div>

        <div class="menu">
            <button type="submit">Start Scan</button>
            <button type="reset" onclick="clearResult()">Clear</button>
        </div>
    </form>

    {% if result %}
    <div class="result" id="scanResult">
        {{ result }}
    </div>
    {% else %}
    <div class="result" id="scanResult" style="display:none;"></div>
    {% endif %}
</div>

<script>
    function clearResult() {
        const res = document.getElementById('scanResult');
        res.textContent = '';
        res.style.display = 'none';
    }
</script>

</body>
</html>
