<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IntSpLoiT Framework Docs</title>
<style>
    body {
        margin: 0;
        font-family: 'Courier New', monospace;
        background-color: #0d0d0d;
        color: #00FF00;
        overflow-x: hidden;
    }

    header {
        background-color: #111;
        padding: 20px;
        border-bottom: 2px solid #00FF00;
        text-align: center;
    }

    header h1 {
        margin: 0;
        font-size: 2.5rem;
        color: #FF0000;
        text-shadow: 0 0 10px #FF0000;
    }

    .container {
        display: flex;
        flex-wrap: wrap;
        padding: 20px;
        gap: 20px;
    }

    .file-list {
        flex: 1 1 250px;
        max-width: 300px;
        background-color: #111;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 0 20px rgba(0,255,0,0.4);
        height: calc(100vh - 80px);
        overflow-y: auto;
    }

    .file-item {
        padding: 12px;
        margin-bottom: 10px;
        border: 1px solid #00FF00;
        border-radius: 5px;
        cursor: pointer;
        transition: transform 0.3s, background-color 0.3s;
    }

    .file-item:hover {
        background-color: #222;
        transform: scale(1.03);
    }

    .file-item.active {
        background-color: #00FF00;
        color: #0d0d0d;
        font-weight: bold;
    }

    .viewer {
        flex: 3 1 600px;
        background-color: #111;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 0 20px rgba(0,255,0,0.4);
        max-height: calc(100vh - 80px);
        overflow-y: auto;
    }

    .viewer h2 {
        color: #FF0000;
        margin-top: 0;
    }

    .viewer pre, .viewer code {
        background-color: #000;
        color: #00FF00;
        padding: 8px;
        border-radius: 5px;
        overflow-x: auto;
        font-family: 'Courier New', monospace;
    }

    a {
        color: #00FF00;
        text-decoration: underline;
    }

    a:hover {
        color: #FF0000;
    }

    @media(max-width: 900px){
        .container {
            flex-direction: column;
        }
        .file-list, .viewer {
            max-height: none;
            height: auto;
        }
    }
</style>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

<header>
    <h1>IntSpLoiT Framework Docs</h1>
</header>

<div class="container">
    <div class="file-list" id="file-list">
        {% for fname, path in md_files.items() %}
        <div class="file-item" onclick="loadFile('{{ fname }}', this)">
            {{ fname }}
        </div>
        {% endfor %}
    </div>

    <div class="viewer" id="viewer">
        <h2>Select a Markdown file</h2>
        <div id="md-content">
            <p>Click on a file from the list to load its content.</p>
        </div>
    </div>
</div>

<script>
function loadFile(filename, element) {
    // Aktif class kontrolü
    document.querySelectorAll('.file-item').forEach(item => item.classList.remove('active'));
    element.classList.add('active');

    fetch(`/docs/view/${filename}`)
        .then(res => {
            if (!res.ok) throw new Error("Failed to load file");
            return res.text();
        })
        .then(html => {
            document.getElementById('md-content').innerHTML = html;
        })
        .catch(err => {
            document.getElementById('md-content').innerHTML = `<p style="color:red;">${err.message}</p>`;
        });
}
</script>

</body>
</html>
